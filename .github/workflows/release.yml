name: Release

# Builds native installers for the Player app on Windows, macOS, and Linux,
# then attaches them to a GitHub Release.
#
# Trigger it by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
# Or run it manually from the Actions tab ("Run workflow").
#
# It only runs on tags / manual dispatch (NOT on every commit) to keep CI
# minutes low — relevant for a private repo where minutes are metered.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write          # needed for tauri-action to create the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS runner builds a universal binary (Intel + Apple Silicon).
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: build the portable AppImage (+ a .deb), skipping rpm.
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage deb'
            rust_targets: ''
          - platform: 'windows-latest'
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/player/src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Canonical Tauri v2 dependency set for Ubuntu 22.04. The old list
          # included the legacy libappindicator3-dev, which fails to install on
          # the runner (apt exit 100) and conflicts with the modern ayatana
          # fork below; libxdo-dev is required and was missing.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: Install JS dependencies (workspace)
        run: npm install

      - name: Build shared rules-engine
        run: npm run build -w @minivanigans/rules-engine

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/player
          tagName: ${{ github.ref_name }}
          releaseName: 'Minivanigans! ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your operating system from the Assets below.'
          releaseDraft: true        # creates a DRAFT release so you can review before publishing
          prerelease: false
          args: ${{ matrix.args }}
